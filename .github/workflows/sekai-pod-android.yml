name: SekaiPod Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable

jobs:
  build-apk:
    name: Build SekaiPod APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build production APK
        run: flutter build apk --release --flavor production

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-production-release.apk SekaiPod-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SekaiPod-Android
          path: SekaiPod-Android.apk
          if-no-files-found: error
